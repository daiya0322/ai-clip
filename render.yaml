services:
  - type: web
    name: ai-clip-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: YOUTUBE_COOKIES_B64
        sync: false
      - key: TMP_DIR
        value: /tmp/ai-clip
    plan: free
