services:
  - type: web
    name: ai-clip-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: YOUTUBE_COOKIES_B64
        sync: false
      - key: TMP_DIR
        value: /tmp/ai-clip
    plan: free
